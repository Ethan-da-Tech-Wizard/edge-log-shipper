# Packaging metadata for edge-log-shipper (PEP 621). No runtime dependencies.
[build-system]
# Minimum setuptools version that understands the [project] table.
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# Core project metadata shown on package indexes and by pip.
[project]
name = "edge-log-shipper"
version = "1.0.0"
description = "Python project for shipping log messages and managing a local spool."
readme = "README.md"
# Matches the oldest interpreter in the classifiers below.
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Ethan Kilmer", email = "ethan@twu.software"}
]
keywords = [
    "syslog",
    "edge",
    "iot",
    "wireguard",
    "log-shipper",
    "cwe-117",
    "store-and-forward",
    "spooler",
    "rfc5424",
    "audit",
]
classifiers = [
      "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
    "Topic :: System :: Networking",
    "Topic :: Security",
]
# Intentionally empty: the shipper is standard-library only.
dependencies = []

# Installs an 'edgeshipper' command that calls edgeshipper.cli:main.
[project.scripts]
edgeshipper = "edgeshipper.cli:main"

# Package only the edgeshipper package; keeps tests/ out of the distribution.
[tool.setuptools.packages.find]
where = ["."]
include = ["edgeshipper*"]
